    # mirrors Tanzil verbatim, and compiled into the simple.db below.
    # Licensing: Tanzil translation terms — free/non-commercial use with
    # attribution, verbatim only (https://tanzil.net/trans/). Credit the
    # translators + Tanzil Project (see ATTRIBUTION.md). Re-clear before any
    # monetization. NOTE: re-introduces Hindi to the build (owner-approved
    # 2026-06; PRD MVP had it deferred).
    - file: sources/hi-suhel-farooq-nadwi-simple.db
      slug: hi-suhel-farooq-nadwi
      language_code: hi
      name: "Suhel Farooq Khan and Saifur Rahman Nadwi"
      native_name: "हिन्दी"
      direction: ltr
      sort_order: 20
      enabled: true
      author: "Suhel Farooq Khan/Saifur Rahman Nadwi"
      license: "Free/non-commercial use with attribution (Tanzil terms); verbatim only. See ATTRIBUTION.md"
      source_url: "https://tanzil.net/trans/hi.hindi"

