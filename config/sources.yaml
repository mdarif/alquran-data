    #
    # Permission granted by the owner/publisher channel (owner confirmed
    # 2026-07-30). Publish through the downloadable-editions CDN, not bundled
    # into the app seed DB, so the native app size stays lean.
    - file: sources/hi-ahsanul-kalam-simple.db
      slug: hi-ahsanul-kalam
      language_code: hi
      name: "Ahsanul Kalam"
      native_name: "हिन्दी"
      direction: ltr
