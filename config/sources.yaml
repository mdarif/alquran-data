# Al Quran — data pipeline config (REAL SOURCES, QUL)
#
# Raw QUL files were downloaded into ./sources/ (git-ignored). Because QUL ships
# the data in several shapes, run the preprocessing step first, then build:
#
#   python pipeline/prepare_sources.py            # -> arabic-ayah.sqlite, structure.sqlite
#   python pipeline/build_db.py --config config/sources.yaml
#   python pipeline/verify_db.py --db assets/quran.db
#
# Licenses below are PLACEHOLDERS — verify each resource's license on its QUL
# page before any public release (PRD Risk: translation/font licensing).

output: assets/quran.db
db_version: "1.1.0"
# 2 = editions carry a stable `slug` plus selector metadata (native_name,
# direction, sort_order, default_on). Consumers select and persist on slug;
# `language_code` groups only, because a language may have several editions.
schema_version: "2"

sources:
  # --- Surah metadata: 114 rows (QUL "Surah names", chapters table) -------
  surahs:
    file: sources/quran-metadata-surah-name.sqlite

  # --- Arabic Uthmani: github.com/quran's golden text + kashida carriers ----
  # `quran.ar.uthmani.v2.db` is the exact QPC Hafs Uthmani text the quran.com /
  # quran-ios apps ship (quran/quran-ios → Domain/QuranResources/Databases). We
  # take its letters + mark encoding (U+06E1 sukun etc.) verbatim, BUT it omits
  # the U+0640 tatweel (kashida) carriers the KFGQPC UthmanicHafs1 Ver18 font
  # needs to seat superscript marks. Without them the elongated madd
  # (يَٰٓأَيُّهَا) collapses on-device — verified via `hb-shape` and confirmed
  # broken in the app (both Impeller and Skia). So we graft ONLY the pure-tatweel
  # runs from the canonical Tanzil edition (same letters), via `tatweel_reference`
  # (build-time, in build_db.py). Bismillah is already a separate header and the
  # text carries no trailing ayah-number glyph.
  arabic_uthmani:
    file: sources/quran.ar.uthmani.v2.db
    table: arabic_text
    columns:
      surah: sura
      ayah: ayah
      text: text
    # Canonical kashida-carrier source (build-time only; positions, not text).
    tatweel_reference: sources/quran-uthmani-tanzil.json
    # Per-ayah reading-form overrides aligning the few spots where golden v2
    # encodes a mark differently than quran.com's displayed QPC Hafs (2:72 hamza,
    # 11:41 imala marker) — golden text with only that one char changed.
    reading_overrides: sources/qpc_hafs_overrides.json

  # --- Arabic IndoPak: authentic Quran.com text in the Noorehuda font ---------
  # IndoPak script option. The **authentic Quran.com IndoPak** text (`text_indopak`
  # field, QPC/PDMS IndoPak lineage) — the one with the correct IndoPak orthography
  # (bare alef+kasra "iyyaka", dagger-alef "maalik", zer under the alef "ihdina").
  # It is authored for PDMS_Saleem and carries PUA marks, so build_indopak_source.py
  # normalises it for **Noorehuda** (CC BY-NC): maps the PUA marks with a Unicode
  # form, strips the 7 IndoPak-specific waqf symbols that have none (standard-Unicode
  # waqf marks are kept). Validated headlessly: 0 `.notdef` shaping all 6236 ayahs,
  # and the (surah,ayah) key set is identical to `arabic_uthmani`. ADDITIVE —
  # populates the reserved `text_arabic_indopak` column; the Uthmani build is
  # untouched. Licensing: Quran.com IndoPak text — clear before release (the Quranic
  # text itself is not copyrightable; the digitisation terms are UNVERIFIED).
  arabic_indopak:
    file: sources/arabic-indopak-quran-com.db
    table: arabic_text
    columns:
      surah: sura
      ayah: ayah
      text: text

  # --- Structural navigation indices: derived per-ayah ---------------------
  # Produced by prepare_sources.py: page (QPC V2 604-page layout), juz, hizb,
  # rub-al-hizb, ruku (QUL marker tables), and sajda (QUL sajdah list).
  metadata:
    file: sources/structure.sqlite
    mode: per_ayah

  # --- Translations (MVP: Urdu only) ---------------------------------------
  # Licensing decision (2026-06-20): the app ships as a FREE, NON-COMMERCIAL
  # / da'wah product. Under that distribution model the Urdu (Junagarhi)
  # translation is cleared for use with attribution (see ATTRIBUTION.md).
  # Urdu is the only default-on edition. Additional translations are emitted as
  # installable CDN editions so the native app size stays lean.
  translations:
    - file: sources/ur-junagarri-simple.db
      # STABLE identity — consumers persist this, never the row id (which is
      # assigned by position in this list and shifts when editions are added).
      # Never rename a slug once shipped: it is the key in saved preferences and
      # in the R2 download catalogue.
      slug: ur-junagarhi
      language_code: ur
      name: "Maulana Muhammad Junagarhi"
      native_name: "اردو"
      direction: rtl
      # GLOBAL display order across all editions, not per-language: it decides
      # the reading order of the translation blocks under each verse, and the
      # language grouping in the selector falls out of it. Urdu first is app
      # parity. Leave gaps so an edition can be slotted in without renumbering.
      sort_order: 10
      # The reader's default edition (Urdu-first audience); everything else is
      # opt-in. Replaces the "Urdu defaults on" rule previously hardcoded in the
      # web toolbar.
      default_on: true
      enabled: true
      author: "Muhammad Junagarhi"
      # PUBLIC DOMAIN (owner determination 2026-07-27; supersedes the Tanzil-terms
      # framing this block previously carried). Translator d. 1941; India/Pakistan
      # life+60 clears it ~2001. Source lineage is Tanzil (ur.junagarhi), but
      # Tanzil is a *redistributor*, not a rights holder — their
      # non-commercial-with-attribution request cannot bind a public-domain work,
      # so we credit them by courtesy, not obligation.
      # NO verbatim-only clause and NO non-commercial restriction: derivatives
      # (Roman Urdu, Devanagari) need no permission, and monetization needs no
      # re-clearing. Credit the translator; see ATTRIBUTION.md.
      license: "Public domain (translator d. 1941). Credit: Muhammad Junagarhi; Tanzil Project by courtesy. See ATTRIBUTION.md"
      source_url: "https://qul.tarteel.ai/resources/translation/305"

    # --- Roman Urdu: experimental Junagarhi edition (RETIRED) ---------------
    # SUPERSEDED 2026-08-03 by ur-roman-abu-rayyan below, and now `enabled: false`
    # — excluded from dist/editions + catalogue.json entirely, on top of the
    # existing client-side gates:
    #   alquran-app  FeatureFlags.romanUrdu = false  (lib/core/feature_flags.dart)
    #   al-quran-web EDITION_FLAGS['ur-roman-junagarhi-experimental'] = false
    #
    # Owner ruling: "ours is a lot better" — Al Quran ships OUR Roman Urdu or
    # none. Compared against our own pilot on Al-Baqarah 1-7 this text renders خ
    # as `q` (qarch, aaqirath), final ت as `th` (hidaayath, najaath), drops
    # nasalisation (hai for ہیں, dilo for دلوں), typos 2:6 as `darsana`, and
    # fuses its own footnote markers into words in 309 verses (parhezgaaro1 —
    # check with: text_content GLOB '*[0-9]*'). The register is Deccani, not the
    # Karachi/Lahore popular register we target. Attribution below is to the
    # THIRD PARTY that made this text (Muhammad Kazim / Al-QuranJino) — it is
    # not Al Marfa's own work and must never be credited to Abu Rayyan.
    #
    # DO NOT "fix" this text here, and do not delete this row — kept dormant
    # (enabled: false) so the comparison stays reproducible and the gates stay
    # one-line flips. See ../alquran-roman-urdu/docs/TRANSLITERATION-GUIDE.md.
    - file: sources/ur-roman-junagarhi-experimental.sqlite
      type: transliteration
      slug: ur-roman-junagarhi-experimental
      language_code: ur
      name: "Roman Urdu (Experimental)"
      native_name: "Roman Urdu"
      direction: ltr
      sort_order: 11
      default_on: false
      enabled: false
      author: "Muhammad Junagarhi; Romanization credited to Muhammad Kazim / Al-QuranJino"
      license: "Experimental third-party rendering; source: Al-QuranJino. Preserve attribution and verify reuse terms before commercial distribution."
      source_url: "https://cdn.jsdelivr.net/gh/jinosh05/quran-api@1/editions/urd-muhammadjunagar1.json"

    # --- Roman Urdu: Al Marfa (Abu Rayyan) -----------------------------------
    # Replaces the retired third-party row above. Own work, own slug — this is
    # NOT the Al-QuranJino text. Source: ../alquran-roman-urdu/data/roman-urdu/,
    # all 6,236 verses across all 114 surahs as of 2026-08-03, hand- and
    # assistant-transliterated by Abu Rayyan (Mohammad Arif) in the popular
    # register per that repo's ADR 0004. Generated via:
    #   python3 pipeline/roman_urdu/export_simple_db.py
    #
    # `enabled: true` but `default_on: false`: every verse there is still
    # `status: beta-unverified` (that repo's own AGENTS.md: nothing ships
    # unreviewed) — installable and visible, opt-in, not switched on for a new
    # reader, exactly like the third-party row was before it was retired.
    # Naming mirrors al-quran-web's scripts/export-quran.mjs overlay exactly
    # (name/author/license strings), so the credit reads identically on web,
    # app, and CDN catalogue.
    - file: sources/ur-roman-abu-rayyan-simple.db
      type: transliteration
      slug: ur-roman-abu-rayyan
      language_code: ur
      name: "Abu Rayyan"
      native_name: "Roman Urdu"
      direction: ltr
      sort_order: 11
      default_on: false
      enabled: true
      author: "Muhammad Junagarhi; transliterated by Abu Rayyan"
      license: "Junagarhi translation is public domain. Transliteration © Abu Rayyan."
      source_url:

