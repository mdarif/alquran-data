# Al Quran — downloadable Tafsir config (EXAMPLE)
#
# Copy to config/tafsir.yaml and point `file` at a downloaded QUL Tafsir SQLite
# export. QUL requires sign-in for downloads:
# https://qul.tarteel.ai/resources/tafsir?tags%5B%5D=English
#
# Tafsir is intentionally separate from translations. Commentary can be long and
# can apply to a range of ayahs, so it should be downloaded on demand into the
# app's future tafsir.db instead of being bundled into quran.db or editions.db.

db_version: "0.1.0"

tafsir:
  - file: sources/tafsir-ibn-kathir-english.sqlite
    slug: en-ibn-kathir-abridged
    language_code: en
    name: "Tafsir Ibn Kathir (Abridged)"
    native_name: "English"
    direction: ltr
    sort_order: 10
    enabled: true
    abridged: true
    author: "Hafiz Ibn Kathir; abridged English edition"
    license: "VERIFY on QUL resource page before release"
    source_url: "https://qul.tarteel.ai/resources/tafsir/35"
