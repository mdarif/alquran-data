# Al Quran — data pipeline config (EXAMPLE)
#
# Copy this file to config/sources.yaml and edit the paths to point at the
# QUL files you downloaded into ./sources/. Some sources aren't on QUL and
# need their own importer first — see README.md "Sources not on QUL" and
# the per-block comments below.
#
# Where to get each resource (download the SQLite export; QUL requires login):
#   Arabic Uthmani / IndoPak script  https://qul.tarteel.ai/resources/quran-script
#   Translations                     https://qul.tarteel.ai/resources/translation/<id>
#   Surah names / structural meta    https://qul.tarteel.ai/resources/quran-metadata
#
# The pipeline auto-detects column names. Only add a `columns:` or `table:`
# override if auto-detection picks the wrong one (verify_db.py will tell you).
#
# Before building: python pipeline/prepare_sources.py (expands QUL's raw
# word/marker tables into arabic-ayah.sqlite + structure.sqlite).

output: assets/quran.db
db_version: "1.0.0"
# 2 = editions carry a stable `slug` plus selector metadata (native_name,
# direction, sort_order, default_on). Consumers select and persist on slug;
# `language_code` groups only, because a language may have several editions.
schema_version: "2"

sources:
  # --- Surah metadata: 114 rows ------------------------------------------
  surahs:
    file: sources/surah-names.sqlite
    # columns:                # optional overrides
    #   id: chapter_id
    #   name_arabic: name_arabic
    #   name_english: name_simple
    #   revelation_place: revelation_place
    #   total_ayahs: verses_count

  # --- Arabic text: works either with an ayah-level script export OR a -----
  # --- word-by-word `words` table (it will aggregate words into ayahs). ----
  arabic_uthmani:
    file: sources/quran-uthmani.sqlite
    # table: arabic_text
    # columns:
    #   surah: sura
    #   ayah: ayah
    #   text: text
    # Optional: graft tatweel (kashida) carriers from a canonical reference if
    # your source omits them (needed by some fonts for superscript marks).
    # tatweel_reference: sources/quran-uthmani-tanzil.json
    # Optional: per-ayah reading-form overrides as a JSON {"surah:ayah": "text"} map.
    # reading_overrides: sources/reading-overrides.json

  # --- Arabic IndoPak script (optional) -----------------------------------
  # Populates the reserved `text_arabic_indopak` column. Additive — leave this
  # block out entirely if you don't need IndoPak. Generate the source with
  # `python pipeline/build_indopak_source.py` if starting from the quran.com
  # IndoPak export (normalises PUA marks for the Noorehuda font).
  # arabic_indopak:
  #   file: sources/arabic-indopak.sqlite
  #   table: arabic_text
  #   columns:
  #     surah: sura
  #     ayah: ayah
  #     text: text

  # --- Structural navigation indices -------------------------------------
  # Two modes:
  #   mode: per_ayah  -> source already has one row per ayah with page/juz/...
  #   mode: markers   -> a JSON file of start-markers per dimension (expanded)
  metadata:
    file: sources/quran-metadata.sqlite
    mode: per_ayah
    # For marker mode instead:
    # file: sources/structure.json
    # mode: markers

  # --- Translations / transliterations ------------------------------------
  # Each entry becomes one row in `resources`. Fields:
  #   slug          STABLE identity consumers persist. Never rename or reuse
  #                 one that's shipped.
  #   type          "translation" (default) | "transliteration" | "tafsir"
  #   language_code ISO-639, e.g. "ur", "hi", "en"
  #   name          full display name
  #   native_name   selector label in its own script (optional)
  #   direction     "rtl" | "ltr"
  #   sort_order    GLOBAL display order across all editions (leave gaps)
  #   default_on    true = shown by default to a new reader (usually false
  #                 for anything but the one flagship edition per app). A
  #                 default_on edition must also be bundled.
  #   bundle        true = full text is included in the native app's bundled
  #                 assets/quran.db seed. false = metadata only in the app seed;
  #                 publish the text as a downloadable edition instead. Keep
  #                 this false for catalogue editions so app installs stay lean.
  #                 For publishing, build a temporary full DB with
  #                 build_db.py --include-downloadable-text.
  #   enabled       true = built into dist/editions + catalogue.json.
  #                 false = kill switch: still built into quran.db (so
  #                 re-enabling needs no re-import) but excluded from the
  #                 downloadable catalogue entirely.
  #   credit_name   OPTIONAL short one-line credit for the reader UI, only
  #                 needed when `author` is a long multi-person credit.
  #   experimental  OPTIONAL true = show an "Experimental" pill (unreviewed
  #                 / pilot content, e.g. an OCR pass not yet manually checked)
  #   license, source_url  record here; keep ATTRIBUTION.md in sync.
  translations:
    - file: sources/translation-urdu-junagarhi.sqlite
      slug: ur-example
      language_code: ur
      name: "Maulana Muhammad Junagarhi"
      native_name: "اردو"
      direction: rtl
      sort_order: 10
      default_on: true
      bundle: true
      enabled: true
      author: "Muhammad Junagarhi"
      license: "VERIFY on QUL resource page before release"
      source_url: "https://qul.tarteel.ai/resources/translation/305"

    - file: sources/translation-hindi.sqlite
      slug: hi-example
      language_code: hi
      name: "Example Hindi Translation"
      native_name: "हिन्दी"
      direction: ltr
      sort_order: 20
      default_on: false
      bundle: false
      enabled: true
      author: "Translator Name"
      license: "VERIFY on QUL resource page before release"
      source_url: "https://qul.tarteel.ai/resources/translation/<id>"

    # A transliteration edition looks the same, with type: transliteration.
    # - file: sources/roman-urdu.sqlite
    #   type: transliteration
    #   slug: ur-roman-example
    #   language_code: ur
    #   name: "Example Roman Urdu"
    #   native_name: "Roman Urdu"
    #   direction: ltr
    #   sort_order: 11
    #   default_on: false
    #   bundle: false
    #   enabled: true
    #   author: "Translator; transliterated by Example"
    #   license: "..."
    #   source_url:
    #   credit_name: "Example"
    #   experimental: true
